async function compressNewsImage(file){
  return await new Promise((resolve,reject)=>{
    if(!file)return resolve('');
    if(!/^image\/(png|jpeg|webp)$/.test(file.type))return reject(new Error('Selecione uma imagem PNG, JPG ou WebP.'));
    const r=new FileReader();
    r.onload=()=>{const im=new Image();im.onload=()=>{const max=900;let w=im.width,h=im.height;if(w>h){if(w>max){h=Math.round(h*max/w);w=max}}else{if(h>max){w=Math.round(w*max/h);h=max}}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);resolve(c.toDataURL('image/jpeg',0.76));};im.onerror=()=>reject(new Error('Não foi possível ler a imagem.'));im.src=r.result;};
    r.onerror=()=>reject(new Error('Não foi possível carregar a imagem.'));r.readAsDataURL(file);
  });
}

  modal(`<h2>✏️ Editar comunicado</h2><form id="editNewsForm">
    <label>Título</label><input id="entitle" required value="${esc(n.title||'')}">

    <label>Foto do anúncio</label><input id="enphoto" type="file" accept="image/png,image/jpeg,image/webp" class="fileinput">
    <small class="muted">Opcional • selecione outra foto para substituir a atual.</small>
    <div id="enphotopreview">${n.photo_url?`<img class="photopreview" src="${n.photo_url}" alt="Foto atual">`:''}</div>
    <label style="display:flex;gap:8px;align-items:center"><input id="enpublished" type="checkbox" ${n.published!==false?'checked':''} style="width:auto"> Publicado</label>

  </form>`);

  document.querySelector('#enphoto').onchange=async()=>{const f=document.querySelector('#enphoto').files[0];if(!f)return;try{selectedPhoto=await compressNewsImage(f);document.querySelector('#enphotopreview').innerHTML=`<img class="photopreview" src="${selectedPhoto}" alt="Nova foto">`;}catch(err){alert(err.message);}};

function fees(){
  const year=window.feeYear||new Date().getFullYear();

  </tbody></table></div></div>`;
}

async function toggleFee(teamId,month,year,button){
  if(!admin)return;
  const existing=S.fees.find(f=>f.team_id===teamId&&Number(f.month)===Number(month)&&Number(f.year)===Number(year));
  const paid=!existing?.paid;
  button.disabled=true;
  try{
    const q=await db.from('monthly_fees').upsert({team_id:teamId,month:Number(month),year:Number(year),paid},{onConflict:'team_id,year,month'}).select().single();
    if(q.error)throw new Error(q.error.message);
    const idx=S.fees.findIndex(f=>f.team_id===teamId&&Number(f.month)===Number(month)&&Number(f.year)===Number(year));
    if(idx>=0)S.fees[idx]=q.data; else S.fees.push(q.data);
    button.className=`fee-status ${paid?'fee-ok':'fee-pending'} fee-btn`;
    button.textContent=paid?'OK':'—';
  }catch(err){alert('Não foi possível alterar a mensalidade.\n\n'+(err?.message||err));}
  finally{button.disabled=false;}
}

function opts(){return S.teams.map(t=>`<option value="${t.id}">${esc(t.name)} — ${esc(t.city||"")}</option>`).join("")}
function compressPhoto(file,max=900,quality=.78){return new Promise((resolve,reject)=>{if(!file)return resolve(null);if(!/^image\/(png|jpe?g|webp)$/i.test(file.type))return reject(new Error("Formato de imagem não suportado."));let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{let c=document.createElement("canvas"),w=im.naturalWidth||im.width,h=im.naturalHeight||im.height;if(w>h){if(w>max){h=Math.round(h*max/w);w=max}}else{if(h>max){w=Math.round(w*max/h);h=max}}c.width=w;c.height=h;let ctx=c.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,w,h);ctx.drawImage(im,0,0,w,h);resolve(c.toDataURL("image/jpeg",quality))};im.onerror=()=>reject(new Error("Não foi possível ler a imagem."));im.src=r.result};r.onerror=()=>reject(new Error("Não foi possível carregar a imagem."));r.readAsDataURL(file)})}
function gameForm(){modal(`<h2>Novo jogo</h2><form id=f><label>Data</label><input id=d type=date required><label>Horário</label><input id=h type=time><label>Rodada</label><input id=rd type=number min=1 placeholder="Ex.: 1"><label>Mandante</label><select id=a>${opts()}</select><label>Visitante</label><select id=b>${opts()}</select><label>Local</label><input id=l><button class=btn>Salvar jogo</button></form>`);document.querySelector("#f").onsubmit=async e=>{e.preventDefault();if(a.value===b.value)return alert("Escolha equipes diferentes.");let r=await db.from("games").insert({match_date:d.value,match_time:h.value||null,home_team_id:a.value,away_team_id:b.value,place:l.value,round:+rd.value||null,status:"Agendado"});if(r.error)return alert(r.error.message);closeModal();await load();render()}}
function resultForm(id){let g=S.games.find(x=>x.id===id);if(!g)return;const teamOpts=(selected)=>S.teams.map(t=>`<option value="${t.id}" ${t.id===selected?'selected':''}>${esc(t.name)} — ${esc(t.city||"")}</option>`).join("");modal(`<h2>⚽ ${g.status==="Final"?"Editar resultado":"Lançar resultado"}</h2><form id=r><div class="formgrid"><div><label>Mandante</label><select id=homeTeam>${teamOpts(g.home_team_id)}</select><label>Placar — Mandante</label><input id=x type=number min=0 value="${g.home_score??0}" required><div class="photoBox"><small>📸 Foto do mandante uniformizado</small><input id=pa type=file accept="image/png,image/jpeg,image/webp" class=fileinput>${g.home_photo_url?`<img class=previewphoto src="${g.home_photo_url}" alt="Foto atual do mandante">`:''}</div></div><div><label>Visitante</label><select id=awayTeam>${teamOpts(g.away_team_id)}</select><label>Placar — Visitante</label><input id=y type=number min=0 value="${g.away_score??0}" required><div class="photoBox"><small>📸 Foto do visitante uniformizado</small><input id=pb type=file accept="image/png,image/jpeg,image/webp" class=fileinput>${g.away_photo_url?`<img class=previewphoto src="${g.away_photo_url}" alt="Foto atual do visitante">`:''}</div></div></div><p class="muted">Você pode corrigir as equipes sem perder o placar nem as fotos já lançadas.</p><button class=btn id=saveResult>Salvar resultado</button></form>`);document.querySelector("#r").onsubmit=async e=>{e.preventDefault();let btn=document.querySelector("#saveResult");btn.disabled=true;btn.textContent="Salvando...";try{const homeTeam=document.querySelector("#homeTeam").value;const awayTeam=document.querySelector("#awayTeam").value;if(homeTeam===awayTeam)throw new Error("Escolha equipes diferentes.");let ba=await compressPhoto(document.querySelector("#pa").files[0]);let bb=await compressPhoto(document.querySelector("#pb").files[0]);let obj={home_team_id:homeTeam,away_team_id:awayTeam,home_score:Number(document.querySelector("#x").value),away_score:Number(document.querySelector("#y").value),status:"Final"};if(ba)obj.home_photo_url=ba;if(bb)obj.away_photo_url=bb;let q=await db.from("games").update(obj).eq("id",id).select().single();if(q.error)throw new Error(q.error.message);if(!q.data)throw new Error("O jogo não foi encontrado para atualização.");closeModal();await load();render();alert("Resultado salvo com sucesso!")}catch(err){btn.disabled=false;btn.textContent="Salvar resultado";alert("Não foi possível salvar o resultado.\n\n"+(err?.message||err))}}}

document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>{page=b.dataset.p;render()});load().then(render);
</script></body></html>
