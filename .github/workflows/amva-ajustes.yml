name: Ajustes AMVA V55.2
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/amva-ajustes.yml'
      - '.github/patch_v552.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar ajustes V55.2
        run: python3 .github/patch_v552.py
      - name: Commit ajustes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Aplica ajustes V55.2: rodadas, horario e icone'
          git push
